<section class="reportpanel">
<h2>REPORT ISSUE</h2>
<h4>Report your campus issue here.</h4>

    <form class="rpissue">

        <div class="top-section">

            <!-- Category Card -->
            <div class="card category-card">

                <label>Category :</label>

                <select class="cdd">
                    <option>Facilities</option>
                    <option>Wi-Fi</option>
                    <option>Library</option>
                    <option>Laboratory</option>
                    <option>Parking</option>
                    <option>Canteen</option>
                    <option>Water Supply</option>
                    <option>Electricity</option>
                    <option>Classroom</option>
                </select>

                <label>Title :</label>

                <input type="textti" placeholder="Enter issue title">

            </div>

            <!-- Description Card -->
            <div class="card description-card">

                <label>Description :</label>

                <textarea placeholder="Describe the issue..."></textarea>

                <input type="file">

            </div>

        </div>

        <div class="bottom-section">

            <!-- Priority -->
            <div class="card priority-card">

    <label>Priority :</label>

    <div class="priority-buttons">

        <input type="radio" id="low" name="priority" value="Low" hidden>
        <label for="low" class="priority-btn low">Low</label>

        <input type="radio" id="medium" name="priority" value="Medium" hidden>
        <label for="medium" class="priority-btn medium">Medium</label>

        <input type="radio" id="high" name="priority" value="High" hidden>
        <label for="high" class="priority-btn high">High</label>

        <input type="radio" id="critical" name="priority" value="Critical" hidden>
        <label for="critical" class="priority-btn critical">Critical</label>

    </div>

</div>

            <!-- Location -->
            <div class="card location-card">

                <label>Location :</label>

                <textarea placeholder="Mention issue location"></textarea>

            </div>

        </div>

        <div class="submit-area">

            <button type="submit" class="submit-btn">
                Submit Report
            </button>

        </div>

    </form>

</div>
</section>
