<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Menu</title>
    <link rel="stylesheet" href="style.css">
    <!-- Included FontAwesome for the bell icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<section class="header">
    <nav>
        <div class="logo">
            <img src="logo.webp" alt="Logo">
        </div>
        
        <div class="header-right">
            
            <div class="notifications">
                <i class="fa-solid fa-bell"></i>
                <span class="badge">1</span>
            </div>

            <!-- Student Info -->
            <div class="student-card">
                <div class="student-details">
                    <h2 id="username">Loading...</h2>
                    <p>Roll No: <span id="rollno">...</span></p>
                </div>
                <div class="profile-pic">
                    <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 150'><rect width='120' height='150' fill='%23e2e8f0'/><circle cx='60' cy='55' r='25' fill='%2394a3b8'/><path d='M 15 130 C 15 95, 35 90, 60 90 C 85 90, 105 95, 105 130 Z' fill='%2394a3b8'/></svg>" alt="Passport Profile Picture">
                </div>
            </div>

        </div>
    </nav>
</section>

<section class="main-body">
    <div class="page-top-bar">
        <h2 class="page-name">Student Menu</h2>
        <div class="switches">
            <select class="menu" onchange="handleMenuSwitch(this)">
                <option value="" disabled selected>Student Menu</option>
                <option value="reportissue.html">Report Issue</option>
                <option value="dashboard.html">Dashboard</option>
                <option value="logout">Logout</option>
            </select>
        </div>
    </div>

    <!-- PAGE CONTENT -->
    <div class="page-content">
        <div class="student-menu-layout">
            
            <!-- Left Side: Profile Sidebar -->
            <div class="profile-sidebar">
                <div class="profile-pic-wrapper">
                    <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 150'><rect width='120' height='150' fill='%23e2e8f0'/><circle cx='60' cy='55' r='25' fill='%2394a3b8'/><path d='M 15 130 C 15 95, 35 90, 60 90 C 85 90, 105 95, 105 130 Z' fill='%2394a3b8'/></svg>" alt="Passport Profile Picture" class="circle-pic" id="sidebar-profile-pic">
                </div>
                <div class="profile-details">
                    <p>NAME : <span id="page-username">Loading...</span></p>
                    <p>ROLL NO.: <span id="page-rollno">...</span></p>
                    <p>DEPARTMENT : <span id="page-department">...</span></p>
                    <p>EMAIL: <span id="page-email">...</span></p>
                </div>
                <button id="editProfileBtn" class="edit-btn">Edit Profile</button>
            </div>

            <!-- Right Side: Stats & Issues Table -->
            <div class="right-content">
                
                <div class="stats-row">
                    <div class="stat-box">
                        <h3>ISSUE REPORTED</h3>
                        <p id="studentTotalIssues">0</p>
                    </div>
                    <div class="stat-box">
                        <h3>ISSUE SOLVED</h3>
                        <p id="studentSolvedIssues">0</p>
                    </div>
                    <div class="stat-box">
                        <h3>ISSUES PENDING</h3>
                        <p id="studentPendingIssues">0</p>
                    </div>
                </div>

                <div class="issues-table-container">
                    <div class="table-header">
                        <h3>MY REPORTED ISSUE</h3>
                    </div>
                    
                    <div class="dashboard-controls-student">
                        <input type="text" id="searchInput" placeholder="Search issues...">
                        
                        <select id="filterSelect">
                            <option value="all">All</option>
                            <option value="pending">Pending</option>
                            <option value="solved">Solved</option>
                        </select>
                    </div>

                    <div class="table-container-student">
                        <table id="issueTableData">
                            <thead>
                                <tr>
                                    <th>Issue ID</th>
                                    <th>Title</th>
                                    <th>Category</th>
                                    <th>Description</th>
                                    <th>Location</th>
                                    <th>Date</th>
                                    <th>Priority</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="issueTable"></tbody>
                        </table>
                    </div>
                </div>

            </div>
        </div>
    </div>
</section>

<!-- Edit Profile Modal -->
<div id="editProfileModal" class="modal">
    <div class="modal-content">
        <span class="close-btn">&times;</span>
        <h2>Edit Your Profile</h2>
        <form id="editProfileForm">
            <div class="form-group">
                <label for="editPic">Profile Picture:</label>
                <input type="file" id="editPic" accept="image/*">
            </div>
            
            <div class="form-group" style="flex-direction: row; align-items: center; gap: 10px; margin-top: -5px; margin-bottom: 15px;">
                <input type="checkbox" id="removePic" style="width: 18px; height: 18px; cursor: pointer;">
                <label for="removePic" style="margin-bottom: 0; font-size: 13px; color: #e11d48; font-weight: 600; cursor: pointer;">Remove current profile picture</label>
            </div>

            <div class="form-group">
                <label for="editName">Name:</label>
                <input type="text" id="editName" required>
            </div>
            <div class="form-group">
                <label for="editEmail">Email:</label>
                <input type="email" id="editEmail" required>
            </div>
            <div class="form-group">
                <label for="editRoll">Roll No:</label>
                <input type="text" id="editRoll" required>
            </div>
            <div class="form-group">
                <label for="editDept">Department / Course:</label>
                <select id="editDept" required style="height: 45px; border: 2px solid #e2e8f0; border-radius: 12px; padding: 0 12px; outline: none; background: #f8fafc; font-size: 15px; width: 100%;">
                    <option value="" disabled selected>Select your course</option>
                    <option value="BCA">BCA</option>
                    <option value="BBA">BBA</option>
                    <option value="BFMO">BFMO</option>
                    <option value="BJMC">BJMC</option>
                    <option value="B.Com">B.Com</option>
                    <option value="ELL">ELL</option>
                    <option value="BMS">BMS</option>
                    <option value="BFA">BFA</option>
                    <option value="Others">Others</option>
                </select>
            </div>
            
            <div id="otherDepartmentContainer" class="form-group" style="display: none;">
                <label for="otherDepartmentInput">Please enter your course name:</label>
                <textarea id="otherDepartmentInput" placeholder="Enter course name..." style="padding: 12px 18px; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 15px; outline: none; background: #f8fafc; color: #1e293b; resize: none; min-height: 80px;"></textarea>
            </div>

            <button type="submit" class="submit-btn" style="background: linear-gradient(to right, #4d7ad9, #20a8e0); color: #fff; border: none; padding: 14px; font-size: 16px; font-weight: 700; cursor: pointer; border-radius: 30px; width: 100%; margin-top: 20px; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(32, 168, 224, 0.3);">Save Changes</button>
        </form>
    </div>
</div>

<script src="Scripts.js"></script>

</body>
</html>
