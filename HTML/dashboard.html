<!-- Dashboard -->
<section class="dashboard">
    <h2>ISSUE DASHBOARD</h2>
    <h4>All the reported issues are diplayed here.</h4>

    <!-- TOP CONTROLS ROW -->
    <div class="dashboard-controls">

        <!-- Search (Left) -->
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search issues...">
        </div>

        <!-- Stats (Center) -->
        <div class="stats-boxes">
            <div class="stat-card">
                <h3>Total Issues</h3>
                <p id="totalIssues">0</p>
            </div>

            <div class="stat-card">
                <h3>Issues Solved</h3>
                <p id="solvedIssues">0</p>
            </div>
        </div>

        <!-- Filter (Right) -->
        <div class="filter-box">
            <select id="filterSelect">
                <option value="all">All</option>
                <option value="pending">Pending</option>
                <option value="approved">Approved</option>
                <option value="in-progress">In Progress</option>
                <option value="solved">Solved</option>
            </select>
        </div>

    </div>

    <!-- TABLE -->
    <div class="table-container">
        <table id="issueTableData">
            <thead>
                <tr>
                    <th>Issue ID</th>
                    <th>Title</th>
                    <th>Category</th>
                    <th>Description</th>
                    <th>Date</th>
                    <th>Priority</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody id="issueTable"></tbody>
        </table>
    </div>
</section>

<footer class="site-footer">
        <p>© 2026 My Website
            <br>
            All Rights Reserved
        </p>
    </footer>

    <script src="script.js"></script>
</body>
