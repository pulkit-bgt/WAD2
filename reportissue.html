<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Issue</title>
    <link rel="stylesheet" href="style.css">
    <!-- Included FontAwesome for the bell icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<section class="header">
    <nav>
        <!-- Logo updated to a div so it doesn't redirect -->
        <div class="logo">
            <img src="logo.webp" alt="Logo">
        </div>
        
        <!-- Wrapper to push the bell and profile to the right -->
        <div class="header-right">
            
            <!-- New Bell / Alert Icon -->
            <div class="notifications">
                <i class="fa-solid fa-bell"></i>
                <span class="badge">1</span> <!-- Optional: Unread message indicator -->
            </div>

            <!-- Student Info -->
            <div class="student-card">
                <div class="student-details">
                    <h2 id="username">Loading...</h2>
                    <p>Roll No: <span id="rollno">...</span></p>
                </div>
                <div class="profile-pic">
                    <img src="profile.png" alt="Profile Picture">
                </div>
            </div>

        </div>
    </nav>
</section>

<section class="main-body">
    <div class="page-top-bar">
        <div class="page-heading-group">
            <h2 class="page-name">Report Issue</h2>
            <p style="color: #666; font-weight: 500; margin-top: 5px;">Report your campus issue here.</p>
        </div>
        <div class="switches">
            <select class="menu" onchange="handleMenuSwitch(this)">
                <option value="" disabled selected>Report Issue</option>
                <option value="studentmenu.html">Student Menu</option>
                <option value="dashboard.html">Dashboard</option>
                <!-- Removed Settings Option -->
                <option value="logout">Logout</option>
            </select>
        </div>
    </div>

    <div class="page-content">
        <form class="rpissue">
            
            <div class="form-row">
                <div class="form-card category-card" style="flex: 1;">
                    <label>Category :</label>
                    <select class="cdd input-field">
                        <option>Facilities</option>
                        <option>Wi-Fi</option>
                        <option>Library</option>
                        <option>Laboratory</option>
                        <option>Parking</option>
                        <option>Canteen</option>
                        <option>Water Supply</option>
                        <option>Electricity</option>
                        <option>Classroom</option>
                    </select>
                    
                    <label style="margin-top: 25px;">Title :</label>
                    <input type="textti" class="input-field" placeholder="Enter issue title">
                </div>
                
                <div class="form-card description-card" style="flex: 2;">
                    <label>Description :</label>
                    <textarea class="input-field" placeholder="Describe the issue..."></textarea>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-card priority-card" style="flex: 1.5;">
                    <label>Priority :</label>
                    <div class="priority-buttons">
                        <input type="radio" id="low" name="priority" value="Low">
                        <label for="low" class="priority-btn low">Low</label>
                        
                        <input type="radio" id="medium" name="priority" value="Medium">
                        <label for="medium" class="priority-btn medium">Medium</label>
                        
                        <input type="radio" id="high" name="priority" value="High">
                        <label for="high" class="priority-btn high">High</label>
                        
                        <input type="radio" id="critical" name="priority" value="Critical">
                        <label for="critical" class="priority-btn critical">Critical</label>
                    </div>
                </div>
                
                <div class="form-card location-card" style="flex: 1.5;">
                    <label>Location :</label>
                    <textarea class="input-field" placeholder="Mention issue location"></textarea>
                </div>
            </div>
            
            <div class="submit-area">
                <button type="submit" class="submit-btn-large">Submit Report</button>
            </div>
            
        </form>
    </div>
</section>

<!-- Link to external JS -->
<script src="Scripts.js"></script>

</body>
</html>
