<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<section class="header">
    <nav>
        <!-- Logo updated to a div so it doesn't redirect -->
        <div class="logo">
            <img src="logo.webp" alt="Logo">
        </div>
        
        <div class="header-right">
            <div class="notifications">
                <i class="fa-solid fa-bell"></i>
                <span class="badge">1</span>
            </div>

            <div class="student-card">
                <div class="student-details">
                    <h2 id="username">Loading...</h2>
                    <p>Roll No: <span id="rollno">...</span></p>
                </div>
                <div class="profile-pic">
                    <img src="profile.png" alt="Profile Picture">
                </div>
            </div>
        </div>
    </nav>
</section>

<section class="main-body">
    <div class="page-top-bar">
        <div class="page-heading-group">
            <h2 class="page-name">Issue Dashboard</h2>
            <p style="color: #666; font-weight: 500; margin-top: 5px;">All the reported issues are displayed here.</p>
        </div>
        
        <div class="switches">
            <select class="menu" onchange="handleMenuSwitch(this)">
                <option value="" disabled selected>Dashboard</option>
                <option value="studentmenu.html">Student Menu</option>
                <option value="reportissue.html">Report Issue</option>
                <!-- Removed Settings Option -->
                <option value="logout">Logout</option>
            </select>
        </div>
    </div>

   <div class="page-content">
        <!-- Top Stats Row -->
        <div class="stats-row" style="margin-bottom: 25px;">
            <div class="stat-box">
                <h3>TOTAL ISSUES</h3>
                <p id="totalIssues">0</p>
            </div>
            <div class="stat-box">
                <h3>ISSUES SOLVED</h3>
                <p id="solvedIssues">0</p>
            </div>
            <!-- Added Pending Issues Box -->
            <div class="stat-box">
                <h3>ISSUES PENDING</h3>
                <p id="pendingIssues">0</p>
            </div>
        </div>

        <!-- Bottom Table Container -->
        <div class="issues-table-container">
            <div class="table-header">
                <h3>ALL CAMPUS ISSUES</h3>
            </div>
            
            <div class="dashboard-controls-student">
                <input type="text" id="searchInput" placeholder="Search issues...">
                <select id="filterSelect">
                    <option value="all">All</option>
                    <option value="pending">Pending</option>
                    <option value="rejected">Rejected</option>
                    <option value="in-progress">In Progress</option>
                    <option value="solved">Solved</option>
                </select>
            </div>

            <div class="table-container-student">
                <table id="issueTableData">
<thead>
    <tr>
        <th>Issue ID</th>
        <th>Title</th>
        <th>Category</th>
        <th>Description</th>
        <th>Location</th>
        <th>Date</th>
        <th>Priority</th>
        <th>Status</th>
        <th>Reported By</th>
    </tr>
</thead>
                    <tbody id="issueTable"></tbody>
                </table>
            </div>
        </div>
    </div>
</section>

<script src="Scripts.js"></script>

</body>
</html>
